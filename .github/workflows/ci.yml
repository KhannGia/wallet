name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs the exact same containers as local development, so a green pipeline
# means the stack genuinely works -- not that some bespoke CI environment does.
jobs:
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The toolchain containers run as uid 1000, but the runner checks the
      # repository out as uid 1001. Without this, any container write to a
      # bind-mounted path (npm updating the lockfile) fails with EACCES.
      # Local machines usually do not hit this because the developer is uid 1000.
      # .git stays with the runner so its post-job cleanup can still rewrite
      # the git config.
      - name: Align checkout ownership with the container user
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .git

      - name: Install Solidity dependencies
        run: ./wallet install-forge

      - name: Check formatting
        run: ./wallet fmt-check

      - name: Run tests
        run: ./wallet test-forge
        env:
          FOUNDRY_PROFILE: ci

  # The backend suite waits on real blocks from anvil, so its length grows with
  # every phase. Each group runs on its own runner -- with its own Postgres and
  # its own chain, so the groups cannot interfere -- and the pipeline takes as
  # long as the slowest group rather than the sum of all of them.
  backend:
    name: Backend (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      # One group failing should not cancel the others: their results are
      # still worth having.
      fail-fast: false
      matrix:
        group: [core, chain, vault, aa, erc7562, graduation]
    steps:
      - uses: actions/checkout@v5

      # The toolchain containers run as uid 1000, but the runner checks the
      # repository out as uid 1001. Without this, any container write to a
      # bind-mounted path (npm updating the lockfile) fails with EACCES.
      # Local machines usually do not hit this because the developer is uid 1000.
      # .git stays with the runner so its post-job cleanup can still rewrite
      # the git config.
      - name: Align checkout ownership with the container user
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .git

      - name: Install dependencies
        run: ./wallet install-node

      # The indexer tests deploy a contract on anvil and read its bytecode from
      # the Foundry artifact directory, so the contracts must be compiled before
      # the backend suite runs -- even though this job is otherwise unrelated to
      # Solidity.
      - name: Compile contracts
        run: |
          ./wallet install-forge
          ./wallet forge build

      - name: Type-check
        run: ./wallet typecheck

      # Brings up Postgres and anvil, then runs the suite against them.
      - name: Run tests
        run: ./wallet test-node ${{ matrix.group }}

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

  # The frontend, driven in a real browser against the whole platform: the
  # demo stack runs the API, the chain, the bundler and every worker, and the
  # tests sign up, deposit, transfer and pay out through the pages.
  e2e:
    name: Frontend (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # As in the jobs above: the containers run as uid 1000.
      - name: Align checkout ownership with the container user
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .git

      - name: Start the demo stack
        run: ./wallet demo up

      - name: Run the end-to-end tests
        run: ./wallet e2e
        env:
          # Writes its reports into the checkout, which uid 1000 owns now.
          E2E_USER: "1000:1000"

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: >
          docker compose -p wallet-demo --env-file docker/demo.env --env-file .env.demo
          --profile demo logs --tail 200
