# Everything runs in containers. The host needs only Docker.
#
# Volume strategy: source is bind-mounted so edits are live, but every
# generated directory (node_modules, forge lib/out/cache) lives in a named
# volume so it never lands on the host filesystem.
name: wallet

x-node-common: &node-common
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  image: wallet-node:local
  user: node
  working_dir: /app
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet}
    RPC_URL: http://anvil:8545
    BUNDLER_URL: http://bundler:4337
    CHAIN_ID: "31337"
    NODE_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    USDC_ADDRESS: ${USDC_ADDRESS:-}
    INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
    FINALITY_MODE: ${FINALITY_MODE:-confirmations}
    FINALITY_CONFIRMATIONS: ${FINALITY_CONFIRMATIONS:-3}
    INDEXER_POLL_MS: ${INDEXER_POLL_MS:-4000}
    HOT_WALLET_PRIVATE_KEY: ${HOT_WALLET_PRIVATE_KEY:-}
    STUCK_AFTER_MS: ${STUCK_AFTER_MS:-60000}
    FEE_BUMP_PERCENT: ${FEE_BUMP_PERCENT:-12}
    MAX_BROADCAST_ATTEMPTS: ${MAX_BROADCAST_ATTEMPTS:-3}
    WITHDRAWAL_POLL_MS: ${WITHDRAWAL_POLL_MS:-4000}
    WALLET_MNEMONIC: ${WALLET_MNEMONIC:-}
    MIN_SWEEP_BALANCE: ${MIN_SWEEP_BALANCE:-1000000}
    GAS_FUNDER_PRIVATE_KEY: ${GAS_FUNDER_PRIVATE_KEY:-}
    SWEEP_GAS_FUNDING_WEI: ${SWEEP_GAS_FUNDING_WEI:-2000000000000000}
    SWEEP_POLL_MS: ${SWEEP_POLL_MS:-15000}
    VAULT_ADDRESS: ${VAULT_ADDRESS:-}
    VAULT_SUBMITTER_PRIVATE_KEY: ${VAULT_SUBMITTER_PRIVATE_KEY:-}
    VAULT_SUBMIT_POLL_MS: ${VAULT_SUBMIT_POLL_MS:-5000}
    REBALANCE_LOW: ${REBALANCE_LOW:-}
    REBALANCE_TARGET: ${REBALANCE_TARGET:-}
    REBALANCE_HIGH: ${REBALANCE_HIGH:-}
    REBALANCE_PROPOSAL_TTL_SECONDS: ${REBALANCE_PROPOSAL_TTL_SECONDS:-86400}
    WALLET_XPUB: ${WALLET_XPUB:-xpub6DyUKdwoLWmUJ4Tn9Bbsdtx7B5Ws18mEN19e5HT52ikE53FiUheSQXrZUNPovqfyKmw4579A1Mm3GXXKM39N64uooBfJ4tNAzFsEbodRTx4}
  volumes:
    - ./:/app
    - node_modules_root:/app/node_modules
    - node_modules_api:/app/services/api/node_modules
    - node_modules_shared:/app/packages/shared/node_modules
    # Compiled contract artifacts, read-only. The backend needs the ABI to
    # decode logs, and forge is the only thing that should ever write here.
    - forge_out:/app/contracts/out:ro

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ wants the mount one level up, at /var/lib/postgresql, so
      # the data ends up in a version-specific subdirectory and pg_upgrade can
      # work across a single mount point.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Local EVM chain. Deterministic mnemonic so test accounts are stable.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # The image entrypoint is `/bin/sh -c`, which would swallow every flag after
    # the first word. Overriding the entrypoint and passing `--flag=value` args
    # as a list keeps the shell out of it entirely.
    entrypoint: ["anvil"]
    command:
      - "--host=0.0.0.0"
      - "--port=8545"
      - "--chain-id=31337"
      - "--block-time=2"
      - "--accounts=10"
      - "--balance=10000"
      - "--mnemonic=test test test test test test test test test test test junk"
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      # Deliberately not 127.0.0.1: probing via the service name goes through
      # the routable interface, so a loopback-only bind fails the healthcheck
      # instead of silently passing.
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://anvil:8545"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Puts the canonical ERC-4337 EntryPoint v0.8 on the local chain, then exits.
  # The bundler waits for it: it serves only an EntryPoint that exists.
  entrypoint-setup:
    image: wallet-foundry:local
    build:
      context: .
      dockerfile: docker/foundry.Dockerfile
    working_dir: /app/contracts
    environment:
      ETH_RPC_URL: http://anvil:8545
    volumes:
      - ./:/app
      - forge_lib:/app/contracts/lib
    entrypoint: ["sh", "script/deploy-entrypoint.sh"]
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy

  # ERC-4337 bundler: takes UserOperations over JSON-RPC and submits them to the
  # EntryPoint in ordinary transactions it pays for. Pinned by digest, like the
  # Solidity dependencies, so every machine runs the same build.
  bundler:
    image: ghcr.io/pimlicolabs/alto@sha256:f2661042aadefc6a4fc9c5826a14404f574c7ef2de76bdf83fe6a0829137b3c5
    command:
      - "--entrypoints=0x4337084D9E255Ff0702461CF8895CE9E3b5Ff108"
      - "--rpc-url=http://anvil:8545"
      # anvil's tenth account, kept out of every test's way. Public devnet key.
      - "--executor-private-keys=0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
      # Deploys Alto's gas-estimation contracts once, at startup. The same key,
      # with refilling off, so it never sends while the executor is bundling.
      - "--utility-private-key=0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
      - "--refilling-wallets=false"
      - "--port=4337"
      - "--block-time=2000"
      # Safe mode enforces ERC-7562 -- what validateUserOp may read and write --
      # by tracing every operation, and anvil lacks the tracer it needs. Off
      # here means those rules go unchecked locally; tests must cover them.
      - "--safe-mode=false"
      - "--log-level=warn"
    ports:
      - "${BUNDLER_PORT:-4337}:4337"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4337/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      entrypoint-setup:
        condition: service_completed_successfully

  api:
    <<: *node-common
    command: npm run dev --workspace @wallet/api
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # Without this, `up --wait` reports the service healthy the moment the
      # container starts, before the server is actually listening.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy

  # One-shot helper containers. Not started by `up`; invoked via the Makefile.
  node-tools:
    <<: *node-common
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c"]
    command: "true"

  forge:
    build:
      context: .
      dockerfile: docker/foundry.Dockerfile
    image: wallet-foundry:local
    profiles: ["tools"]
    working_dir: /app/contracts
    environment:
      RPC_URL: http://anvil:8545
      # cast and forge read this automatically, so subcommands that take no
      # --rpc-url flag (cast wallet new, forge fmt) still work unchanged.
      ETH_RPC_URL: http://anvil:8545
    volumes:
      - ./:/app
      - forge_lib:/app/contracts/lib
      - forge_out:/app/contracts/out
      - forge_cache:/app/contracts/cache
    command: "forge --version"

volumes:
  pgdata:
  node_modules_root:
  node_modules_api:
  node_modules_shared:
  forge_lib:
  forge_out:
  forge_cache:
