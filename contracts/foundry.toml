[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

# Pinned so every machine and CI run produces identical bytecode.
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 200

# No filesystem or external process access from tests. A wallet codebase has no
# reason to need either, and both widen the blast radius of a malicious
# dependency.
ffi = false
fs_permissions = []

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
anvil = "${RPC_URL}"
